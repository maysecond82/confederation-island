  if(total>=this.expected()||late){let bk=null,bc=-1;Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(k=>{if(c[k]>bc){bc=c[k];bk=k;}});
   const dec=UIS.st.scenes[UIS.di],i=dec.opts.findIndex(o=>o.k===bk);clearInterval(this.tmr);UIS.waiting=0;{const pv={},vk=this.votes[this.key()]||{};Object.keys(vk).forEach(pr=>{const q=this.peers.find(x=>x.peer===pr);pv[q?this.keyOf(q):pr]=vk[pr];});this.voteContracts(vk.me,pv);}delete this.votes[this.key()];if(i>=0)applyOpt(i);}},
 badge(dec,i){if(!this.room)return '';const c=this.tally()[dec.opts[i].k];return c?`<i class="vb">${c} vote${c>1?'s':''}</i>`:'';},
 banner(){if(!this.room)return '';const n=this.others().filter(p=>(p.presence||{}).i===ISL).length;if(UIS.waiting){const t=Object.values(this.tally()).reduce((a,b)=>a+b,0);return `<div class="muted" style="margin:6px 0;color:#ffd23f">Vote d’équipe : ${t} sur ${this.expected()} ont voté. Le choix le plus populaire l’emporte. En attente...</div>`;}
  return n?`<div class="muted" style="margin:6px 0">Vote d’équipe actif : ${n} camarade${n>1?'s sont':' est'} sur cette île. Chacun choisit, puis le choix majoritaire est joué.</div>`:'';},
 roster(){if(!this.room)return '';const o=this.others();return `<span class="lf">Classe ${esc(this.code||'open')}: ${o.length+1} en ligne</span>`;},
 /* leaderboard */
 score(){const ok=RUN.sup>=GOAL;return Math.round(RUN.sup*10+(ok?500:0)+(ok?Math.max(0,(MEDALS[2]-RUN.mo))*4:0)+(RUN.sunk.filter(x=>x).length?0:100));},
 async submit(){if(!this.db||!this.uid||!RUN)return;const s=this.score();try{const ref=this.db.doc('board/'+this.uid),cur=await ref.get();if(cur.exists&&(cur.data().score||0)>=s)return;await ref.set({name:this.name||'Joueur',score:s,sup:Math.round(RUN.sup),win:RUN.sup>=GOAL?1:0,medal:medalOf(RUN.mo)||'none',ts:Date.now()});}catch(e){}},
 watchBoard(cb){if(!this.db)return;try{if(this.bunsub)this.bunsub();this.bunsub=this.db.collection('board').orderBy('score','desc').limit(10).onSnapshot(s=>{this.board=s.docs.map(d=>d.data());cb&&cb();},()=>{});}catch(e){}},
 boardHtml(){if(!this.db)return '<p class="muted">Le classement nécessite le lien partagé.</p>';return this.board.length?`<ol style="text-align:left;font-size:15px;margin:6px 0 6px 18px">${this.board.map(b=>`<li><b>${esc(b.name)}</b> - ${b.score} pts${b.win?', Confédération réussie':''}${b.medal&&b.medal!=='none'?', '+esc(b.medal):''}</li>`).join('')}</ol>`:'<p class="muted">Aucun pointage pour l’instant. Terminez une partie pour être premier.</p>';},
 card(){const j=this.room?`<p style="font-size:15px">Vous êtes dans la classe <b>${esc(this.code||'open')}</b> en tant que <b>${esc(this.name)}</b>. ${this.others().length+1} en ligne.</p>`:'';
  ovr(`<h2>Jouer ensemble</h2><p class="muted" style="font-size:14px">Tous ceux qui ont le même code de classe partagent une salle. Vous vous voyez marcher sur la même île et vous votez en équipe sur les décisions.</p>${this.ok()?'':'<p class="lose">Le multijoueur n’est pas disponible dans cette vue.</p>'}\n  <div style="display:grid;gap:8px;text-align:left"><label>Votre nom<br><input id="mpn" maxlength="14" value="${esc(this.name)}" style="width:100%;font:inherit;padding:6px"></label><label>Code de classe (lettres et chiffres)<br><input id="mpc" maxlength="20" value="${esc(this.code)}" placeholder="p. ex. 8eannee" style="width:100%;font:inherit;padding:6px"></label>\n  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mpt" ${this.team?'checked':''}> Votes d’équipe (la majorité décide)</label></div>${j}${this.err?`<p class="lose">${esc(this.err)}</p>`:''}\n  <div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" data-mp="join">${this.room?'Mettre à jour':'Se joindre'}</button>${this.room?'<button class="btn" data-mp="leave">Quitter</button>':''}<button class="btn" data-mp="back">Retour</button></div>`);
  ['mpn','mpc'].forEach(id=>{const e=document.getElementById(id);if(e)['keydown','keyup'].forEach(t=>e.addEventListener(t,ev=>ev.stopPropagation()));});},
 boardCard(back){this.watchBoard(()=>{if(document.getElementById('mpb'))document.getElementById('mpb').innerHTML=this.boardHtml();});ovr(`<h2>Classement</h2><div id="mpb">${this.boardHtml()}</div><div class="row" style="justify-content:center"><button class="btn" data-mp="${back||'back'}">Retour</button></div>`);}
};
document.addEventListener('click',async e=>{const t=e.target.closest&&e.target.closest('[data-mp]');if(!t)return;const a=t.dataset.mp;
 if(a==='open')MP.card();else if(a==='board')MP.boardCard('back');else if(a==='back')title();
 else if(a==='join'){MP.team=document.getElementById('mpt').checked?1:0;t.disabled=true;await MP.join(document.getElementById('mpn').value,document.getElementById('mpc').value);MP.card();}

/* ---------- diplomacy: alliances, wars, written contracts between players ---------- */
const clean=s=>String(s==null?'':s).replace(/[<>&"'`]/g,'').replace(/[\u0000-\u001f\u200b-\u200f\u202a-\u202e]/g,'').slice(0,300);
Object.assign(MP,{
 dp:{allies:{},wars:{},inbox:[],contracts:[],log:[],cool:0,seen:0},
 myKey(){const me=this.peers.find(p=>p.isMe);return this.uid||(me&&me.peer)||'me';},
 keyOf(p){return p.by||p.peer;},
 nameOf(k){const p=this.others().find(x=>this.keyOf(x)===k);return p&&p.presence&&p.presence.n||this.dp.allies[k]||this.dp.wars[k]||'Joueur';},
 dsend(to,data){if(!this.room)return;this.room.emit('dip',Object.assign({to,n:this.name},data)).catch(()=>{});},
 note(t){this.dp.log.unshift(t);this.dp.log=this.dp.log.slice(0,12);try{toast(t,5000);}catch(e){}if(typeof SFX!=='undefined')SFX.play(/ally|allies/i.test(t)?'ally':/war|raid/i.test(t)?'war':/signed|sign/i.test(t)?'stamp':'pop');this.dp.seen=0;this.refresh();},
 refresh(){if(document.getElementById('dipcard'))this.dip(true);hud();},
 hook(){if(this._hooked||!this.room)return;this._hooked=1;this.room.on('dip',m=>{if(m.sameTab)return;const d=m.data||{};if(d.to!==this.myKey())return;this.onDip(this.keyOf(m),m,d);});},
 onDip(k,m,d){const nm=clean(d.n)||'Joueur',id=clean(d.id);const dp=this.dp;
  if(d.t==='ally'){dp.inbox.push({id:id||('a'+Date.now()),t:'ally',from:k,name:nm});this.note(nm+' propose une alliance.');}
  else if(d.t==='ally_ok'){dp.allies[k]=nm;delete dp.wars[k];this.note('Vous et '+nm+' êtes maintenant alliés.');}
  else if(d.t==='ally_no'){this.note(nm+' a refusé votre alliance.');}
  else if(d.t==='ally_end'){delete dp.allies[k];this.note(nm+' a rompu l’alliance.');}
  else if(d.t==='war'){dp.wars[k]=nm;delete dp.allies[k];this.note(nm+' vous a déclaré la GUERRE!');}
  else if(d.t==='peace'){dp.inbox.push({id:id||('p'+Date.now()),t:'peace',from:k,name:nm});this.note(nm+' demande la paix.');}
  else if(d.t==='peace_ok'){delete dp.wars[k];this.note('Paix avec '+nm+'.');}
  else if(d.t==='raid'){if(!RUN)return;if(RUN.mat>0){RUN.mat--;this.dsend(k,{t:'raid_res',blocked:1});this.note('Vous avez dépensé une caisse et repoussé un raid de '+nm+'.');}else{RUN.sup=Math.max(0,RUN.sup-4);RUN.hp=Math.max(5,RUN.hp-8);this.dsend(k,{t:'raid_res',blocked:0});this.note(nm+' a fait un raid contre vous! -4 appui, île affaiblie.');}hud();}
  else if(d.t==='raid_res'){this.note(d.blocked?nm+' a bloqué votre raid.':'Votre raid contre '+nm+' a fonctionné. Il ou elle a perdu de l’appui et de la stabilité.');}
  else if(d.t==='contract'){dp.inbox.push({id,t:'contract',from:k,name:nm,title:clean(d.title),text:clean(d.text),clause:clean(d.clause),amt:Math.max(0,Math.min(9,d.amt|0))});this.note(nm+' vous a envoyé un contrat : '+clean(d.title));}
  else if(d.t==='c_ok'){const c=dp.contracts.find(x=>x.id===id&&x.role==='author');if(!c||c.state!=='sent')return;
    if(c.clause==='give'&&(!RUN||RUN.mat<c.amt)){c.state='void';this.dsend(k,{t:'c_void',id});this.note('Contrat avec '+nm+' annulé : vous ne pouvez pas payer '+c.amt+' caisse(s).');return;}
    if(c.clause==='give')RUN.mat-=c.amt;c.state='signed';this.dsend(k,{t:'c_sign',id});this.note('Contract "'+c.title+'" signé avec '+nm+'.');hud();}
  else if(d.t==='c_sign'){const c=dp.contracts.find(x=>x.id===id&&x.role==='partner');if(!c)return;c.state='signed';if(c.clause==='give'&&RUN)RUN.mat+=c.amt;this.note('Contract "'+c.title+'" est signé.'+(c.clause==='give'?' Vous avez reçu '+c.amt+' caisse(s).':''));hud();}
  else if(d.t==='c_void'){const c=dp.contracts.find(x=>x.id===id);if(c)c.state='void';this.note('Contract "'+(c?c.title:'')+'" a été annulé.');}
  else if(d.t==='c_no'){const c=dp.contracts.find(x=>x.id===id);if(c)c.state='declined';this.note(nm+' declined "'+(c?c.title:'votre contrat')+'".');}
  else if(d.t==='breach'){const c=dp.contracts.find(x=>x.id===id);if(c)c.state='rompu par eux';this.note(nm+' a rompu votre contrat!');}
  else if(d.t==='bonus'){if(RUN&&dp.allies[k]){RUN.sup=Math.min(100,RUN.sup+1);this.note('Votre allié '+nm+' a bien décidé. +1 appui.');hud();}}},
 /* actions */
 propAlly(k){this.dsend(k,{t:'ally',id:'a'+Date.now()});this.note('Alliance proposée à '+this.nameOf(k)+'.');},
 breakAlly(k){const nm=this.nameOf(k);delete this.dp.allies[k];this.dsend(k,{t:'ally_end'});if(RUN){RUN.sup=Math.max(0,RUN.sup-3);hud();}this.note('Vous avez rompu l’alliance avec '+nm+'. Déshonneur : -3 appui.');},
 declareWar(k){const nm=this.nameOf(k);if(this.dp.allies[k])return this.note("Rompez d'abord l'alliance.");this.dp.wars[k]=nm;this.dsend(k,{t:'war'});this.note('Vous avez déclaré la guerre à '+nm+'.');},
 raid(k){const dp=this.dp,now=performance.now();if(!RUN)return;if(now<dp.cool)return this.note('Vos troupes se reposent encore.');if(RUN.mat<1)return this.note('Un raid coûte 1 caisse de provisions.');
  const nm=this.nameOf(k);const pc=dp.contracts.find(c=>c.state==='signed'&&c.clause==='peace'&&c.with===k);if(pc){pc.state='rompu par vous';RUN.sup=Math.max(0,RUN.sup-5);this.dsend(k,{t:'breach',id:pc.id});this.note('Vous avez rompu le contrat de paix avec '+nm+'. -5 appui.');}
  RUN.mat--;dp.cool=now+20000;this.dsend(k,{t:'raid'});hud();this.refresh();},
 propPeace(k){this.dsend(k,{t:'peace',id:'p'+Date.now()});this.note('Paix offerte à '+this.nameOf(k)+'.');},
 answer(i,yes){const it=this.dp.inbox[i];if(!it)return;this.dp.inbox.splice(i,1);const k=it.from,nm=it.name;
  if(it.t==='ally'){if(yes&&!this.dp.wars[k]){this.dp.allies[k]=nm;this.dsend(k,{t:'ally_ok'});this.note('Vous et '+nm+' êtes maintenant alliés.');}else this.dsend(k,{t:'ally_no'});}
  else if(it.t==='peace'){if(yes){delete this.dp.wars[k];this.dsend(k,{t:'peace_ok'});this.note('Paix avec '+nm+'.');}}
  else if(it.t==='contract'){if(yes){this.dp.contracts.push({id:it.id,role:'partner',with:k,name:nm,title:it.title,text:it.text,clause:it.clause,amt:it.amt,state:'accepted',at:Date.now()});this.dsend(k,{t:'c_ok',id:it.id});this.note('Vous avez accepté « '+it.title+' ». En attente de la signature de '+nm+'.');}else{this.dsend(k,{t:'c_no',id:it.id});}}
  this.refresh();},
 writeContract(k,title,text,clause,amt){title=clean(title).slice(0,40)||'Entente';text=clean(text);amt=Math.max(1,Math.min(9,amt|0||1));const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  this.dp.contracts.push({id,role:'author',with:k,name:this.nameOf(k),title,text,clause,amt,state:'sent',at:Date.now()});this.dsend(k,{t:'contract',id,title,text,clause,amt});this.note('Contract "'+title+'" envoyé à '+this.nameOf(k)+'.');},
 afterDecision(r){if(!r||r.s<10)return;Object.keys(this.dp.allies).forEach(k=>this.dsend(k,{t:'bonus'}));},
 voteContracts(myK,peerVotes){const dp=this.dp;dp.contracts.filter(c=>c.state==='signed'&&c.clause==='vote'&&c.role==='partner'&&!c.done).forEach(c=>{const pk=peerVotes[c.with];if(pk===undefined)return;c.done=1;if(pk===myK){c.state='kept';this.note('Vous avez tenu votre promesse de vote envers '+c.name+'.');}else{c.state='rompu par vous';RUN.sup=Math.max(0,RUN.sup-3);this.dsend(c.with,{t:'breach',id:c.id});this.note('Vous avez rompu votre promesse de vote envers '+c.name+'. -3 appui.');hud();}});},
 clauseText(c){return c.clause==='give'?`${c.role==='author'?'Vous donnez':'Vous recevez'} ${c.amt} caisse${c.amt>1?'s':''} de provisions`:c.clause==='vote'?(c.role==='author'?`${c.name} vote comme vous au prochain vote d'équipe`:`Vous votez comme ${c.name} au prochain vote d'équipe`):c.clause==='peace'?"Aucun camp ne mène de raid contre l'autre (la rupture coûte 5 d'appui)":"Sur l'honneur seulement";},
 /* ui */
 dip(keep){if(!RUN)return;if(!keep){if(mode!=='map')return;mode='ui';}const dp=this.dp;dp.seen=1;const o=this.others(),open=document.getElementById('dipcard');const sel=open?(document.getElementById('dpt')||{}).value:null;
  const opts=o.map(p=>`<option value="${esc(this.keyOf(p))}" ${this.keyOf(p)===sel?'selected':''}>${esc(clean((p.presence||{}).n)||'Joueur')}</option>`).join('');
  const rows=o.map(p=>{const k=this.keyOf(p),nm=clean((p.presence||{}).n)||'Joueur',al=dp.allies[k],wr=dp.wars[k];return `<div class="row" style="justify-content:space-between;align-items:center;text-align:left;gap:6px"><span><b>${esc(nm)}</b> ${al?'<span style="color:#7be07b">allié</span>':wr?'<span style="color:#ff6a5a">en guerre</span>':''}</span><span>${al?`<button class="btn small" data-dp="break" data-k="${esc(k)}">Rompre l’alliance</button>`:wr?`<button class="btn small" data-dp="raid" data-k="${esc(k)}">Raid (1 caisse)</button><button class="btn small" data-dp="peace" data-k="${esc(k)}">Offrir la paix</button>`:`<button class="btn small" data-dp="ally" data-k="${esc(k)}">Allié</button><button class="btn small" data-dp="war" data-k="${esc(k)}">Déclarer la guerre</button>`}</span></div>`;}).join('')||'<p class="muted">Aucun camarade en ligne. Joignez une classe sous Jouer ensemble.</p>';
  const inbox=dp.inbox.map((it,i)=>`<div class="card" style="text-align:left;margin:6px 0"><b>${esc(it.name)}</b> ${it.t==='ally'?'propose une alliance.':it.t==='peace'?'demande la paix.':`a envoyé un contrat : <b>${esc(it.title)}</b><br><span class="muted">${esc(it.text)}</span><br><i>${esc(this.clauseText({clause:it.clause,amt:it.amt,role:'partner',name:it.name}))}</i>`}<div class="row"><button class="btn small primary" data-dp="yes" data-i="${i}">${it.t==='contract'?'Signer':'Accepter'}</button><button class="btn small" data-dp="no" data-i="${i}">Refuser</button></div></div>`).join('');
  const cons=dp.contracts.slice().reverse().map(c=>`<div style="text-align:left;font-size:14px;margin:4px 0"><b>${esc(c.title)}</b> avec ${esc(c.name)} <span class="muted">[${esc(c.state)}]</span><br><span class="muted">${esc(c.text)}</span><br><i>${esc(this.clauseText(c))}</i></div>`).join('')||'<p class="muted">Aucun contrat pour l’instant.</p>';
  const w=open?{t:(document.getElementById('dtt')||{}).value,x:(document.getElementById('dtx')||{}).value,c:(document.getElementById('dtc')||{}).value,a:(document.getElementById('dta')||{}).value}:{t:'',x:'',c:'none',a:'1'};
  ovr(`<div id="dipcard" style="max-height:min(70vh,560px);overflow:auto;padding-right:4px"><h2>Diplomatie</h2><p class="muted" style="font-size:14px">Caisses : ${RUN.mat||0}. Les alliés partagent les bonnes nouvelles (+1 d’appui quand un allié décide bien). La guerre permet de faire un raid pour 1 caisse : cela leur coûte 4 d’appui, sauf s’ils dépensent une caisse pour bloquer.</p>${inbox?`<div class="label">On vous attend</div>${inbox}`:''}<div class="label">Camarades</div>${rows}\n  <div class="label">Rédiger un contrat</div><div style="display:grid;gap:6px;text-align:left"><select id="dpt" style="font:inherit;padding:5px">${opts}</select><input id="dtt" maxlength="40" placeholder="Titre, p. ex. Pacte maritime" value="${esc(w.t||'')}" style="font:inherit;padding:5px"><textarea id="dtx" maxlength="300" rows="3" placeholder="Rédigez les conditions avec vos propres mots" style="font:inherit;padding:5px">${esc(w.x||'')}</textarea>\n  <select id="dtc" style="font:inherit;padding:5px"><option value="none" ${w.c==='none'?'selected':''}>Sur l’honneur (aucune règle)</option><option value="give" ${w.c==='give'?'selected':''}>Je leur donne des caisses (appliqué)</option><option value="vote" ${w.c==='vote'?'selected':''}>Ils doivent voter comme moi au prochain vote d’équipe (appliqué)</option><option value="peace" ${w.c==='peace'?'selected':''}>Pas de raids entre nous (appliqué)</option></select><input id="dta" type="number" min="1" max="9" value="${esc(w.a||'1')}" style="font:inherit;padding:5px" aria-label="Caisses" title="Caisses pour la clause de don"><button class="btn primary" data-dp="send">Envoyer le contrat</button></div>\n  <div class="label">Vos contrats</div>${cons}${dp.log.length?`<div class="label">Récent</div><p class="muted" style="font-size:13px;text-align:left">${dp.log.slice(0,5).map(esc).join('<br>')}</p>`:''}<div class="row" style="justify-content:center"><button class="btn" data-dp="close">Fermer</button></div></div>`);
  ['dpt','dtt','dtx','dtc','dta'].forEach(id=>{const e=document.getElementById(id);if(e)['keydown','keyup'].forEach(t=>e.addEventListener(t,ev=>ev.stopPropagation()));});}
});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-dp],#dipb');if(!t)return;if(t.id==='dipb'){MP.dip();return;}const a=t.dataset.dp,k=t.dataset.k;
 if(a==='close'){ovr('');mode='map';}else if(a==='ally')MP.propAlly(k);else if(a==='break')MP.breakAlly(k);else if(a==='war')MP.declareWar(k);else if(a==='raid')MP.raid(k);else if(a==='peace')MP.propPeace(k);

 if(a==='ally'||a==='break'||a==='war'||a==='peace')MP.refresh();});

/* ---------- checkpoints: continue, or restart from an earlier island ---------- */
const CK={key:'ci_ck',
 all(){try{const d=JSON.parse(localStorage.getItem(CK.key)||'null');return d&&d.pts?d:{pts:{},cur:null,done:0};}catch(e){return {pts:{},cur:null,done:0};}},
 write(d){try{localStorage.setItem(CK.key,JSON.stringify(d));}catch(e){}},
 put(){if(!RUN||RUN.rv||RUN.st>=NI||RUN.st!==ISL)return;const d=CK.all();if(RUN.st===0)d.pts={};d.pts[RUN.st]=JSON.stringify(RUN);d.cur=RUN.st;d.done=0;CK.write(d);},
 finish(){const d=CK.all();d.done=1;CK.write(d);},
 some(){return Object.keys(CK.all().pts).length>0;},

function vEpi(){const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener" style="color:#ffd23f">${t}</a>`;
 return `<div class="card"><h1 style="font-size:26px">Le Canada, de 1999 à 2026</h1><p>La Confédération ne s’est pas arrêtée au Nunavut. Cette page résume brièvement deux sujets d’actualité, rédigés le 13 novembre 2026. L’actualité n’a pas encore d’histoire établie et les faits changent sans cesse : il n’y a donc pas de bonne réponse à noter ici. Lisez les sources.</p></div>
 <div class="card"><h2>Le Canada et les États-Unis : le commerce</h2><ul class="fxl">
 <li>Les États-Unis ont imposé des droits de douane sur de nombreux produits canadiens à partir de 2025. En juin 2025, le président Trump a annoncé qu’il mettait fin aux discussions commerciales avec le Canada (${L('https://www.npr.org/2025/06/27/nx-s1-5448577/trump-us-china-trade-rare-earths','NPR')}).</li>
 <li>Le 12 novembre 2026, le représentant américain au Commerce, Jamieson Greer, a dit que les deux gouvernements s’étaient parlé ces derniers jours au sujet d’une possible entente et a décrit l’objectif comme un accord mutuellement avantageux (${L('https://www.ctvnews.ca/world/trumps-tariffs/article/canada-and-us-have-spoken-within-the-past-few-days-about-potential-deal-trade-rep-greer/','CTV News')}).</li>
 <li>Selon un titre de NewsNation, Trump affirme que les États-Unis et le Canada sont près de mettre fin à la guerre commerciale (${L('https://www.newsnationnow.com/politics/trump-canada-carney-trade-deal/','NewsNation')}). Je n’ai pas pu lire l’article complet, donc aucune condition n’est donnée ici.</li>
 <li>Pourquoi c’est lié à la Confédération : le commerce et les tarifs ont beaucoup pesé dans l’union des colonies, en 1866, quand les États-Unis ont mis fin à leur traité de commerce avec l’Amérique du Nord britannique.</li></ul></div>
 <div class="card"><h2>La guerre avec l’Iran</h2><ul class="fxl">
 <li>Les États-Unis et Israël ont lancé des frappes contre l’Iran le 28 février 2026. CBS News parlait d’une guerre de huit mois dans sa mise à jour du 3 novembre 2026 (${L('https://www.cbsnews.com/live-updates/iran-war-us-trump-negotiations-midterms/','CBS News')}).</li>
 <li>À cette date, aucun cessez-le-feu officiel n’était signalé. Trump a dit qu’il n’y avait pas eu de combats importants depuis des mois et a menacé de reprendre de grandes frappes après les élections américaines de mi-mandat.</li>
 <li>La navigation dans le détroit d’Ormuz est menacée : l’agence maritime britannique UKMTO a recensé 30 attaques contre des navires commerciaux en octobre, un record.</li>
 <li>Le Qatar et le Pakistan servent de médiateurs dans des discussions indirects. L’Iran a proposé de libérer des avoirs gelés et de lever le blocus naval américain en échange d’une réouverture graduelle du détroit. Trump a dit qu’une entente était possible. Des responsables iraniens ont jugé la réponse américaine peu convaincante.</li>
 <li>Les prix du pétrole ont réagi : le Brent était proche de 105 $ le baril le 2 novembre 2026.</li></ul></div>
 <div class="card"><h2>Pensez comme un historien</h2><ul class="fxl"><li>Qui parle, et que veut-il?</li><li>Sur quoi deux sources différentes s’accordent-elles?</li><li>Qu’est-ce qui est une affirmation, et qu’est-ce qui est un fait documenté?</li><li>Quelles voix manquent, comme celles des nations autochtones et de l’Ouest au moment de la Confédération?</li></ul><p class="muted" style="font-size:14px">Ces résumés viennent de reportages publiés jusqu’au 13 novembre 2026 et peuvent être dépassés au moment où vous les lisez.</p></div>

GAMES.climb=()=>{const TOP=620,rocks=[];
 const g={title:"L'escalade de la falaise",how:['Maintenez HAUT pour grimper. Gauche et droite pour vous déplacer.','Les chutes de pierres coûtent un cœur. Grimper fatigue,','relâchez HAUT pour reprendre votre souffle.','Atteignez la corniche du sommet.'],
  x:240,h:0,hp:3,stam:100,tired:0,inv:0,t:0,rt:0,over:false,win:false,
  update(dt){this.t+=dt;this.inv=Math.max(0,this.inv-dt);const dx=held.right-held.left;this.x=Math.max(50,Math.min(430,this.x+dx*90*dt));
   if(held.up&&!this.tired&&this.stam>0){this.h+=36*dt;this.stam-=22*dt;if(this.stam<=0){this.tired=1;}}else{this.stam=Math.min(100,this.stam+(held.up?10:24)*dt);if(this.tired&&this.stam>35)this.tired=0;}
   this.rt-=dt;if(this.rt<=0){this.rt=.55+Math.random()*.5;rocks.push({x:50+Math.random()*380,y:-10,s:1.3+Math.random()*1.4,r:4+Math.random()*4});}
   rocks.forEach(r=>{r.y+=r.s*60*dt;});for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];if(r.y>300)rocks.splice(i,1);else if(!this.inv&&Math.abs(r.x-this.x)<r.r+8&&Math.abs(r.y-this.sy())<r.r+12){rocks.splice(i,1);this.hp--;this.inv=1.2;this.h=Math.max(0,this.h-22);SFX.play('hurt');}}
   if(this.h>=TOP){this.win=true;this.over=true;}if(this.hp<=0)this.over=true;},
  cam(){return Math.max(0,Math.min(this.h-90,TOP-190));},sy(){return CH-60-(this.h-this.cam());},
  draw(){const cam=this.cam();rect(0,0,CW,CH,'#6a8fb8');rect(0,0,CW,60,'#8fb2d0');
   rect(30,0,420,CH,'#7a6a58');for(let y=-40;y<CH+40;y+=34){const yy=y+((cam*1)%34);rect(30,yy,420,2,'#5a4a3c');rect(30+((y*7)%90),yy+6,30,4,'#8a7a66');}
   rect(26,0,6,CH,OL);rect(448,0,6,CH,OL);
   const topY=CH-60-(TOP-cam)-10;if(topY>-20&&topY<CH){rect(30,topY,420,CH,'#4a7a3a');rect(30,topY,420,4,'#7ab05a');otxt('SOMMET',240,topY+16,10,'#fff','center','#10060a');}
   for(let i=0;i<9;i++){const hy=((i*53+17)%CH);const wy=(hy+cam*1.0)%CH;rect(60+((i*97)%360),wy,10,6,'#3a2a20');}
   rocks.forEach(r=>{ell(r.x,r.y,r.r,r.r,'#3a3028');ell(r.x-1,r.y-1,r.r-1,r.r-1,'#6a5a4a');});
   const yy=this.sy();
   if(this.inv<=0||Math.floor(time*12)%2)person(this.x,yy+10,myPal(),'u',held.up&&!this.tired?1+(Math.floor(time*8)%2):0);
   rect(0,0,CW,16,'rgba(10,4,8,.7)');for(let i=0;i<3;i++)otxt(i<this.hp?'#':'-',14+i*14,12,12,i<this.hp?'#ff5a5f':'#4a3a3a','left','#10060a');
   rect(100,5,120,7,OL);rect(101,6,118*this.stam/100,5,this.tired?'#ff6a50':'#6ab04a');otxt(this.tired?'Essoufflé!':'Prise',230,12,8,'#f0e0c8','left','#10060a');otxt(Math.min(100,Math.round(this.h/TOP*100))+'%',CW-10,12,9,'#ffb060','right','#10060a');
  },
  score(){return this.win?Math.max(.55,this.hp/3):.2;},report(){return this.win?(this.hp===3?'Escalade parfait.':'Vous y êtes arrivé, meurtri.'):"Vous avez glissé jusqu'en bas.";}};return g;};

/* ---- paddle (river canoe) ---- */
GAMES.paddle=()=>{const obs=[],L=36;
 const g={title:'La descente de la rivière',how:['Dirigez à gauche et à droite.','Évitez les rochers et les billots flottants.',"Restez à flot jusqu'à la ligne d'arrivée."],x:240,t:0,hp:3,inv:0,rt:0,over:false,win:false,d:0,
  update(dt){this.t+=dt;this.inv=Math.max(0,this.inv-dt);const dx=held.right-held.left;this.x=Math.max(60,Math.min(420,this.x+dx*110*dt));this.d+=dt;const sp=70+this.t*1.4;
   this.rt-=dt;if(this.rt<=0&&this.t<L-4){this.rt=.55+Math.random()*.4;const log=Math.random()<.4;obs.push({x:60+Math.random()*360,y:-20,log,w:log?30:10});}
   obs.forEach(o=>o.y+=sp*dt);for(let i=obs.length-1;i>=0;i--){const o=obs[i];if(o.y>300)obs.splice(i,1);else if(!this.inv&&Math.abs(o.x-this.x)<o.w+8&&Math.abs(o.y-220)<12){obs.splice(i,1);this.hp--;this.inv=1.2;SFX.play('hurt');}}
   if(this.t>=L){this.win=true;this.over=true;}if(this.hp<=0)this.over=true;},
  draw(){rect(0,0,CW,CH,'#3a6a8a');rect(40,0,400,CH,'#4a86aa');rect(0,0,40,CH,'#3a6a3a');rect(440,0,40,CH,'#3a6a3a');
   for(let i=0;i<14;i++){const y=((i*41+this.d*70)%CH);rect(60+((i*83)%360),y,26,2,'#86bcd8');}
   obs.forEach(o=>{if(o.log){rect(o.x-o.w,o.y-5,o.w*2,10,OL);rect(o.x-o.w+1,o.y-4,o.w*2-2,8,'#8a5a30');}else{ell(o.x,o.y,10,8,'#2a2a30');ell(o.x-1,o.y-1,8,6,'#7a7a82');}});
   if(this.t>L-5)rect(40,Math.max(-10,(this.t-(L-5))*60-30),400,6,'#fff');
   if(this.inv<=0||Math.floor(time*12)%2){ell(this.x,222,10,22,OL);ell(this.x,222,8,20,'#c08a4a');person(this.x,222,myPal(),'u',1+(Math.floor(time*6)%2));}
   rect(0,0,CW,16,'rgba(10,4,8,.7)');for(let i=0;i<3;i++)otxt(i<this.hp?'#':'-',14+i*14,12,12,i<this.hp?'#ff5a5f':'#4a3a3a','left','#10060a');otxt(Math.max(0,Math.ceil(L-this.t))+'s',CW-10,12,9,'#ffb060','right','#10060a');},
  score(){return this.win?Math.max(.55,this.hp/3):.2;},report(){return this.win?(this.hp===3?'Descente parfait.':'Vous y êtes arrivé, cabossé.'):'Vous avez chaviré.';}};return g;};

/* ---- seek (search the crates, hot or cold) ---- */
GAMES.seek=()=>{const C=6,R=3,tx=rr(C),ty=rr(R),tries=8;
 const g={title:'La fouille',how:['Déplacez le curseur avec les flèches.','Appuyez sur A pour fouiller une caisse.','Rouge veut dire proche, bleu veut dire loin.','Vous avez 8 fouilles.'],cx:2,cy:1,left:tries,hint:'',hot:{},over:false,found:false,
  press(k){if(this.over)return;if(k==='left')this.cx=Math.max(0,this.cx-1);else if(k==='right')this.cx=Math.min(C-1,this.cx+1);else if(k==='up')this.cy=Math.max(0,this.cy-1);else if(k==='down')this.cy=Math.min(R-1,this.cy+1);
   else if(k==='act'){const key=this.cx+','+this.cy;if(this.hot[key]!=null)return;this.left--;if(this.cx===tx&&this.cy===ty){this.found=true;this.over=true;SFX.play('win');return;}
    const d=Math.abs(this.cx-tx)+Math.abs(this.cy-ty);this.hot[key]=d;this.hint=d<=1?'Très chaud!':d<=2?'Chaud':d<=3?'Tiède':'Froid';SFX.play('click');if(this.left<=0)this.over=true;}},
  update(){},
  draw(){rect(0,0,CW,CH,'#3a2a22');rect(0,0,CW,CH,'rgba(0,0,0,.2)');for(let y=0;y<CH;y+=16)rect(0,y,CW,1,'#2a1c16');
   for(let y=0;y<R;y++)for(let x=0;x<C;x++){const X=60+x*60,Y=80+y*54,k=x+','+y,d=this.hot[k];const col=d==null?'#9a7040':d<=1?'#e0553a':d<=2?'#e08a3a':d<=3?'#7a9ac0':'#4a6a9a';
    rect(X-1,Y-1,52,46,OL);rect(X,Y,50,44,col);rect(X,Y+18,50,3,'rgba(0,0,0,.25)');rect(X+22,Y+14,6,10,'#2a1810');if(d!=null)otxt('x',X+25,Y+34,10,'#fff','center','#10060a');
    if(x===this.cx&&y===this.cy){rect(X-4,Y-4,58,3,'#ffe070');rect(X-4,Y+45,58,3,'#ffe070');rect(X-4,Y-4,3,52,'#ffe070');rect(X+51,Y-4,3,52,'#ffe070');}
    if(this.over&&x===tx&&y===ty)otxt(this.found?'TROUVÉ':'here',X+25,Y+30,10,'#ffe070','center','#10060a');}
   rect(0,0,CW,16,'rgba(10,4,8,.7)');otxt('Fouilles restantes '+this.left,12,12,9,'#ffb060','left','#10060a');otxt(this.hint||'Choisissez une caisse',CW-12,12,9,'#f0e0c8','right','#10060a');},
  score(){return this.found?Math.min(1,.55+this.left/tries*.6):.2;},report(){return this.found?'Trouvé avec '+this.left+' fouille(s) en réserve.':'Pas ici. Essayez encore.';}};return g;};

/* ---- fps: a small first-person raycaster, soft cartoon assaillants ---- */
GAMES.fps=()=>{const M=['################','#..............#','#..##....##....#','#..#......#....#','#..............#','#....####......#','#....#..#...##.#','#....#..#...#..#','#..............#','#.##...........#','#.#....#####...#','#......#.......#','#..##..........#','#..............#','#..............#','################'];
 const wall=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return y<0||y>=16||x<0||x>=16||M[y][x]==='#';};
 const en=[];for(let k=0;k<7;k++){let x,y;do{x=1.5+Math.random()*13;y=1.5+Math.random()*7;}while(wall(x,y)||Math.hypot(x-8,y-14)<6);en.push({x,y,hp:1,out:0,hit:0,sp:.5+Math.random()*.25});}
 const g={title:'Gardez la porte',how:['GAUCHE et DROITE tournent. HAUT et BAS avancent.',"Appuyez sur A pour lancer un tir d'étourdissement sans danger.","Assommez les assaillants avant qu'ils vous atteignent.","Ils ne font que vous bousculer, personne n'est vraiment blessé."],
  px:8,py:14,a:-Math.PI/2,hp:3,t:0,cd:0,flash:0,over:false,zb:[],ko:0,total:en.length,
  update(dt){this.t+=dt;this.cd=Math.max(0,this.cd-dt);this.flash=Math.max(0,this.flash-dt);this.a+=(held.right-held.left)*2.2*dt;const m=(held.up-held.down)*2.4*dt,nx=this.px+Math.cos(this.a)*m,ny=this.py+Math.sin(this.a)*m;if(!wall(nx,this.py))this.px=nx;if(!wall(this.px,ny))this.py=ny;
   en.forEach(e=>{if(e.out)return;e.hit=Math.max(0,e.hit-dt);const dx=this.px-e.x,dy=this.py-e.y,d=Math.hypot(dx,dy);if(d<.6){e.out=1;this.hp--;this.flash=.35;SFX.play('hurt');return;}const nx=e.x+dx/d*e.sp*dt,ny=e.y+dy/d*e.sp*dt;if(!wall(nx,e.y))e.x=nx;if(!wall(e.x,ny))e.y=ny;});
   if(this.t>=50||this.hp<=0||en.every(e=>e.out))this.over=true;},
  press(k){if(k!=='act'||this.cd>0||this.over)return;this.cd=.38;SFX.play('click');let b=null,bd=99;en.forEach(e=>{if(e.out)return;const dx=e.x-this.px,dy=e.y-this.py,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-this.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<Math.atan(.45/d)&&d<bd&&this.ray(this.px,this.py,Math.atan2(dy,dx))>d-.2){bd=d;b=e;}});if(b){b.out=1;b.hit=.3;this.ko++;SFX.play('coin');}},
  ray(x,y,a){let d=0;const c=Math.cos(a),s=Math.sin(a);while(d<20){d+=.05;if(wall(x+c*d,y+s*d))return d;}return 20;},
  draw(){rect(0,0,CW,CH/2,'#6a8fb8');rect(0,CH/2,CW,CH/2,'#4a3a30');this.zb=[];const N=160,S=CW/N,fov=1.05;
   for(let i=0;i<N;i++){const ra=this.a+(i/N-.5)*fov,d0=this.ray(this.px,this.py,ra),d=d0*Math.cos(ra-this.a);this.zb[i]=d;const h=Math.min(CH*1.4,CH/d*.9),sh=Math.max(.25,1-d/12);const hx=this.px+Math.cos(ra)*d0,hy=this.py+Math.sin(ra)*d0,vert=Math.abs(hx-Math.round(hx))<.06;
    const v=Math.floor(120*sh*(vert?1:.8));ctx.fillStyle='rgb('+(v+30)+','+(v+10)+','+v+')';ctx.fillRect(i*S,CH/2-h/2,S+.5,h);}
   const sp=en.filter(e=>!e.out||e.hit>0).map(e=>({e,d:Math.hypot(e.x-this.px,e.y-this.py)})).sort((a,b)=>b.d-a.d);
   sp.forEach(({e,d})=>{let da=Math.atan2(e.y-this.py,e.x-this.px)-this.a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)>fov/2+.2)return;const sx=(da/fov+.5)*CW,h=Math.min(CH*1.2,CH/d*.9),w=h*.45;
    for(let x=sx-w/2;x<sx+w/2;x+=S){const ci=Math.floor(x/S);if(ci<0||ci>=N||this.zb[ci]<d)continue;const top=CH/2-h/2;ctx.fillStyle=e.hit>0?'#fff':'#8a2a2a';ctx.fillRect(x,top+h*.28,S+.5,h*.72);ctx.fillStyle=e.hit>0?'#fff':'#e0b890';ctx.fillRect(x,top,S+.5,h*.28);}
    if(e.hit<=0){ctx.fillStyle='#1a0c10';ctx.fillRect(sx-w*.3,CH/2-h/2+h*.08,w*.15,h*.06);ctx.fillRect(sx+w*.15,CH/2-h/2+h*.08,w*.15,h*.06);}});
   if(this.flash>0)rect(0,0,CW,CH,'rgba(255,40,40,'+this.flash*.8+')');
   rect(CW/2-6,CH/2,12,1,'#fff');rect(CW/2,CH/2-6,1,12,'#fff');rect(CW-120,CH-60,0,0,'#000');
   rect(0,0,CW,16,'rgba(10,4,8,.7)');for(let i=0;i<3;i++)otxt(i<this.hp?'#':'-',14+i*14,12,12,i<this.hp?'#ff5a5f':'#4a3a3a','left','#10060a');otxt('Assommés '+this.ko+'/'+this.total,CW/2,12,9,'#f0e0c8','center','#10060a');otxt(Math.max(0,Math.ceil(50-this.t))+'s',CW-10,12,9,'#ffb060','right','#10060a');},
  score(){return Math.min(1,this.ko/this.total*1.05)*(0.6+0.4*this.hp/3);},report(){return 'Vous avez assommé '+this.ko+' assaillants sur '+this.total+'.';}};return g;};

function bibShort(k){const b=BIB.find(x=>x.k===k);if(!b)return '';return (b.a?b.a.replace(/\.$/,'')+', ':'')+b.t.replace(/[“”.]/g,'').replace(/\.$/,'');}
function recBox(place){const d=STN[place];if(!d)return '';
 const tags=d.c.map(c=>`<span style="display:inline-block;margin:0 6px 4px 0;padding:2px 8px;border:1px solid #c8643c;border-radius:10px;font-size:13px">${HL.causes[c]}</span>`).join('');
 const sr=d.s.length?`<p class="muted" style="font-size:13px;margin:4px 0 0">${HL.src}: ${d.s.map(k=>esc(bibShort(k))).join('; ')}. ${HL.full}</p>`:'';
 return `<div class="card"><h2>${HL.rec}</h2><div>${tags}</div>${sr}</div>`;}
const _vEnd0=vEnd;

function realOpt(place,q){const n=ALLN.find(x=>!x.ambient&&x.place===place);if(!n)return '';const d=n.scenes.find(s=>s.q===q);const o=d&&d.opts.find(x=>x.real);return o?o.t:'';}
function histCards(){
 const stns=ALLN.filter(n=>!n.ambient).slice(0,NI);
 const groups=['pol','eco','def'].map(c=>{const ps=stns.filter(n=>STN[n.place]&&STN[n.place].c.includes(c));return `<li><b>${HL.causes[c]}.</b> ${ps.map(n=>esc(n.title)).join('; ')}</li>`;}).join('');
 const rows=RUN.hist.map(h=>{const r=h.real?'':realOpt(h.st,h.q);return `<li class="${h.real?'win':'lose'}"><b>${esc(h.st)}.</b> ${HL.ch}: ${esc(h.c)}. ${h.real?HL.same:HL.diff+(r?` ${HL.real}: ${esc(r)}`:'')}</li>`;}).join('');
 const qs=HL.q.map((q,i)=>`<p style="margin:10px 0 4px">${esc(q)}</p><textarea data-rf="${i}" rows="3" placeholder="${HL.ph}" style="width:100%;box-sizing:border-box;font:inherit;padding:6px;background:#1c0e0a;color:#f4e6d0;border:1px solid #6a3a28;border-radius:6px">${esc((RUN.refl||{})[i]||'')}</textarea>`).join('');
 return `<div class="card"><h2>${HL.cause}</h2><ul class="fxl">${groups}</ul></div><div class="card"><h2>${HL.path}</h2><ul class="fxl">${rows}</ul></div><div class="card"><h2>${HL.refl}</h2><p class="muted" style="margin:0">${HL.reflIntro}</p>${qs}</div>`;}

  d.opts.forEach((o,j)=>{const p=`stations.${i}.scenes.${k}.opts.${j}`;h+=`<div class="edopt"><b>Option ${'ABC'[j]}</b><label>Choix</label><input data-e="${p}.t" value="${ea(o.t)}"><label>Courte indication</label><input data-e="${p}.d" value="${ea(o.d)}"><label>Ce qui se passe (texte du résultat)</label><textarea data-e="${p}.r" rows="2">${ea(o.r)}</textarea>\n   <div class="edrow"><span><label>Appui gagné (0 à 14)</label><input type="number" data-e="${p}.s" value="${o.s}"></span><span><label>Mois perdus</label><input type="number" data-e="${p}.m" value="${o.m}"></span><span class="edw"><label>Qui il aide (+) ou nuit (-) : mar, que, ont, west, ind</label><input data-e="${p}.f" data-t="f" value="${ea(edFstr(o.f))}"></span></div>\n   <label class="edchk"><input type="checkbox" data-e="${p}.real" ${o.real?'checked':''}> C’est ce qui s’est réellement passé (marqué « comme dans l’histoire »)</label>${o.late?`<label>Texte de la conséquence ultérieure</label><input data-e="${p}.late" value="${ea(o.late)}">`:''}</div>`;});h+='</div>';});
 return h;}
const TPLNOTE={pitchHead:'Comment un mentor commence. {op} = ses premiers mots, {opt} = le choix, {rest} = une raison ci-dessous.',pitchPos:'Raison quand le choix aide son peuple. {fa} = son peuple.',pitchZero:"Raison quand le choix n'aide ni ne nuit.",pitchNeg:'Raison quand le choix est le moindre mal.',atkHurt:"Quand le choix de l'autre mentor nuit à son peuple. {fs} = nom court de son peuple.",atkOther:'Attaque contre un groupe que le choix blesse. {bad} = ce groupe.',atkLate:'Attaque quand le choix a un mauvais résultat différé.',atkTime:'Attaque quand le choix est lent. {mo} = mois.',atkIgnore:"Attaque quand rien d'autre ne convient.",agree:'Quand les deux mentors choisissent la même chose. {fb} = son peuple, {jab} = sa pique.',advPos:'Conseil affiché sur la carte du mentor (aide son peuple). {opt} {fa}',advZero:'Conseil affiché sur la carte du mentor (neutre).',advNeg:'Conseil affiché sur la carte du mentor (moindre mal).',grumble:'Dit quand vous ignorez son conseil une fois. {name} = le mentor.',revenge:'Dit quand vous ignorez son conseil deux fois de suite. Il répand ensuite des rumeurs.',revengeNews:'La rumeur qui suit. {name} {fa}',revengeBig:"Dit quand vous l'ignorez trois fois de suite.",revengeBigNews:'La conséquence plus grave qui suit.',replyGood:'Réponses quand vous dites quelque chose de gentil. Une par ligne.',replyNeu:'Réponses quand vous demandez pourquoi.',replyBad:"Réponses quand vous doutez d'eux.",replyRude:'Réponses quand vous êtes impoli.'};
function edMentors(){let h='<p class="muted">Ce que dit chaque mentor pendant les conférences. Les « premiers mots » lancent son argumentaire, et la « pique » est sa riposte dans une dispute.</p>';MPOOL.forEach(id=>{const m=ED.mentors[id];h+=`<div class="edopt"><b>${ea(NAMES[id])}</b><label>Sa citation</label><textarea data-e="mentors.${id}.quip" rows="2">${ea(m.quip)}</textarea><label>Premiers mots</label><input data-e="mentors.${id}.op" value="${ea(m.op)}"><label>Sa pique contre l’autre mentor</label><input data-e="mentors.${id}.jab" value="${ea(m.jab)}"></div>`;});return h;}
function edTpl(){let h='<p class="muted">Les phrases que les mentors utilisent pour argumenter. Les mots entre accolades, comme {fa}, sont remplis par le jeu. Gardez-les. Une phrase par ligne, et le jeu en choisit une au hasard.</p>';Object.keys(ED.tpl).forEach(k=>{const v=ED.tpl[k],arr=Array.isArray(v);h+=`<div class="edopt"><b>${k}</b><p class="muted">${ea(TPLNOTE[k]||'')}</p>${arr?`<textarea data-e="tpl.${k}" data-t="lines" rows="${Math.max(2,v.length+1)}">${ea(v.join('\n'))}</textarea>`:`<textarea data-e="tpl.${k}" rows="2">${ea(v)}</textarea>`}</div>`;});return h;}
function openEditor(){if(document.getElementById('edov'))return;ED=edSnap();const o=document.createElement('div');o.id='edov';o.className='mapov';
 o.innerHTML=`<div class="mapbox edbox"><h2>Modifier l’histoire</h2><p class="muted">Changez les mots et les décisions. Les changements sont enregistrés dans ce navigateur et utilisés la prochaine fois que vous appuyez sur Commencer. Les conseils des amis et des habitants suivent vos changements automatiquement.</p><div class="row"><label for="edsel">Événement</label><select id="edsel">${ED.stations.map((s,i)=>`<option value="${i}">${i+1}. ${ea(s.place)} (${DATES[i]})</option>`).join('')}<option value="m">Mentors : ce qu’ils disent</option><option value="t">Mentors : comment ils argumentent</option></select></div><div id="edform"></div><div class="row"><button class="btn primary" id="edsave">Sauvegarder</button><button class="btn" id="edreset">Tout remettre à l’original</button><button class="btn" id="edexp">Afficher le texte à copier</button><button class="btn" id="edimp">Charger depuis le texte</button><button class="btn" id="edx">Fermer</button></div><p id="edmsg" class="muted"></p><textarea id="edtxt" rows="6" placeholder="Exporter ou importer : toute l’histoire en texte" style="width:100%"></textarea></div>`;
 document.body.appendChild(o);const show=()=>{const v=$('#edsel').value;$('#edform').innerHTML=v==='m'?edMentors():v==='t'?edTpl():edForm(+v);};show();
 const msg=t=>{$('#edmsg').textContent=t;};
 $('#edsel').onchange=show;
 o.addEventListener('input',e=>{const t=e.target,p=t.dataset.e;if(!p)return;let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.t==='lines')v=v.split('\n').map(x=>x.trim()).filter(Boolean);else if(t.dataset.t==='f')v=edFparse(v);else if(t.type==='number')v=+v;edSet(p,v);});
 $('#edsave').onclick=()=>{edApply(ED);let ok=true;try{localStorage.setItem(EDKEY,JSON.stringify(ED));}catch(e){ok=false;}msg(ok?'Sauvegardé. Appuyez sur Commencer pour jouer avec vos changements.':"Appliqué pour cette visite seulement : ce navigateur ne l'a pas enregistré. Utilisez « Afficher le texte à copier » pour en garder une copie.");};
 $('#edreset').onclick=()=>{edApply(ED_ORIG);ED=JSON.parse(JSON.stringify(ED_ORIG));try{localStorage.removeItem(EDKEY);}catch(e){}show();msg("Tout est revenu à l'original.");};
 $('#edexp').onclick=()=>{$('#edtxt').value=JSON.stringify(ED);msg('Copiez ce texte dans un endroit sûr. Collez-le plus tard et appuyez sur « Charger depuis le texte ».');};
 $('#edimp').onclick=()=>{try{let d=JSON.parse($('#edtxt').value);if(Array.isArray(d))d=Object.assign(edSnap(),{stations:d});if(!d.stations)throw 0;ED=d;edApply(ED);show();msg('Chargé. Appuyez sur Sauvegarder pour le conserver.');}catch(e){msg("Ce texte n'est pas une histoire que je peux lire.");}};
 $('#edx').onclick=()=>o.remove();}
document.addEventListener('click',e=>{if(e.target.closest('#editb'))openEditor();});

window.__ready=1;
</script>
